<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>HunteraFarm</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="appbar">
      <section class="brand" aria-label="HunteraFarm, cliente não oficial">
        <img class="brand-logo" src="assets/hunterafarm-logo.png" alt="HunteraFarm" />
        <span class="unofficial">não oficial</span>
      </section>

      <nav class="account-switcher" aria-label="Contas do Huntera">
        <div id="account-slots" class="account-slots"></div>
        <button
          id="add-account-button"
          class="add-account-button"
          type="button"
          title="Adicionar outra tela (máximo de quatro)"
          aria-label="Adicionar outra tela"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 5v14M5 12h14" />
          </svg>
          <span>Adicionar</span>
        </button>
      </nav>

      <section class="controls" aria-label="Controles">
        <button
          id="layout-button"
          class="control-button layout-button"
          type="button"
          title="Mostrar as telas abertas juntas (Ctrl+Shift+L)"
          aria-pressed="false"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <rect x="3" y="4" width="18" height="16" rx="2" />
            <path d="M12 4v16M3 12h18" />
          </svg>
          <span class="control-label">Ver juntas</span>
        </button>

        <span class="control-divider" aria-hidden="true"></span>

        <button
          id="reload-button"
          class="icon-button"
          type="button"
          title="Recarregar conta selecionada (Ctrl+R)"
          aria-label="Recarregar conta selecionada"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M20 11a8 8 0 1 0-2.3 5.7" />
            <path d="M20 5v6h-6" />
          </svg>
        </button>

        <button
          id="mute-button"
          class="icon-button"
          type="button"
          title="Silenciar conta selecionada (Ctrl+M)"
          aria-label="Silenciar conta selecionada"
        >
          <svg class="sound-on" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M11 6 7 10H4v4h3l4 4V6Z" />
            <path d="M15 9a4 4 0 0 1 0 6" />
            <path d="M18 6a8 8 0 0 1 0 12" />
          </svg>
          <svg class="sound-off" viewBox="0 0 24 24" aria-hidden="true" hidden>
            <path d="M11 6 7 10H4v4h3l4 4V6Z" />
            <path d="m16 10 4 4m0-4-4 4" />
          </svg>
        </button>

        <span class="control-divider" aria-hidden="true"></span>

        <button
          id="support-button"
          class="control-button support-button"
          type="button"
          title="Apoiar o HunteraFarm via Pix"
          aria-label="Apoiar o HunteraFarm via Pix"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8l1.1 1.1L12 21l7.8-7.5 1.1-1.1a5.5 5.5 0 0 0-.1-7.8Z" />
          </svg>
          <span class="control-label">Apoiar</span>
        </button>

        <button
          id="clear-button"
          class="control-button danger clear-button"
          type="button"
          title="Limpar login somente da conta selecionada"
          aria-label="Limpar login da conta selecionada"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 7h16" />
            <path d="M9 7V4h6v3" />
            <path d="m7 7 1 13h8l1-13" />
            <path d="M10 11v5m4-5v5" />
          </svg>
          <span class="control-label" data-clear-label>Limpar Conta 1</span>
        </button>

        <button
          id="fullscreen-button"
          class="icon-button"
          type="button"
          title="Tela cheia (F11)"
          aria-label="Alternar tela cheia"
        >
          <svg class="expand-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M8 3H3v5M16 3h5v5M8 21H3v-5m13 5h5v-5" />
          </svg>
          <svg class="contract-icon" viewBox="0 0 24 24" aria-hidden="true" hidden>
            <path d="M8 8H3V3m13 5h5V3M8 16H3v5m13-5h5v5" />
          </svg>
        </button>
      </section>
    </header>

    <div id="announcer" class="visually-hidden" aria-live="polite"></div>
    <script src="renderer.js"></script>
  </body>
</html>
