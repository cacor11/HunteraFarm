name: Publicar versões com estatísticas

on:
  workflow_dispatch:
    inputs:
      windows_run_id:
        description: Execução aprovada do pacote Windows
        required: true
        default: "32881838948"
      android_run_id:
        description: Execução aprovada do pacote Android
        required: true
        default: "32881839014"
      android_artifact:
        description: Nome do artefato Android aprovado
        required: true
        default: HunteraFarm-Android-Beta-25

permissions:
  actions: read
  contents: write

jobs:
  publish:
    name: Conferir e publicar downloads
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      WINDOWS_TAG: v1.2.1
      ANDROID_TAG: v0.1.3-android-beta
      WINDOWS_ARTIFACT: HunteraFarm-1.2.1-unsigned-review

    steps:
      - name: Baixar artefatos aprovados
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release/windows release/android
          gh run download "${{ inputs.windows_run_id }}" --repo "$GITHUB_REPOSITORY" --name "$WINDOWS_ARTIFACT" --dir release/windows
          gh run download "${{ inputs.android_run_id }}" --repo "$GITHUB_REPOSITORY" --name "${{ inputs.android_artifact }}" --dir release/android

      - name: Validar nomes e hashes
        shell: bash
        run: |
          set -euo pipefail
          test -f release/windows/HunteraFarm-Setup-1.2.1-x64.exe
          test -f release/windows/HunteraFarm-Sem-Instalar-1.2.1-x64.zip
          test -f release/windows/SHA256SUMS.txt
          test -f release/android/HunteraFarm-Android-0.1.3-beta.apk
          test -f release/android/SHA256SUMS.txt
          (cd release/windows && sha256sum --check SHA256SUMS.txt)
          (cd release/android && sha256sum --check SHA256SUMS.txt)

      - name: Preparar notas públicas
        shell: bash
        run: |
          cat > windows-notes.md <<'EOF'
          ## HunteraFarm 1.2.1 para Windows

          - use de uma a quatro contas em uma única janela;
          - começa com apenas uma tela aberta para consumir menos memória;
          - adicione ou feche telas quando quiser, liberando a memória da conta fechada;
          - zoom automático menor ao dividir a janela;
          - contador anônimo opcional de instalações online e totais, com controle visível no player.

          A medição envia somente um UUID aleatório da instalação, plataforma e versão. Não envia login, personagem, senha nem conteúdo do jogo.

          **Aviso:** esta versão ainda não possui assinatura Authenticode. O Windows SmartScreen pode exibir um alerta. Compare o SHA-256 publicado antes de executar.
          EOF

          cat > android-notes.md <<'EOF'
          ## HunteraFarm 0.1.3 beta para Android

          - até quatro contas mantidas abertas ao trocar de tela, sem recarregar a cada troca;
          - botão Fechar para liberar a memória somente da conta escolhida;
          - contador anônimo opcional de instalações online e totais;
          - botão Uso ON/OFF e explicação de privacidade dentro do app.

          A medição envia somente um UUID aleatório da instalação, plataforma e versão. Não envia login, personagem, senha nem conteúdo do jogo.

          Esta é uma versão beta. Por usar assinatura de desenvolvimento, pode ser necessário desinstalar uma beta anterior antes de instalar, o que apaga as sessões salvas no app.
          EOF

      - name: Publicar Windows 1.2.1
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$WINDOWS_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$WINDOWS_TAG" release/windows/HunteraFarm-Setup-1.2.1-x64.exe release/windows/HunteraFarm-Sem-Instalar-1.2.1-x64.zip release/windows/SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$WINDOWS_TAG" --repo "$GITHUB_REPOSITORY" --title "HunteraFarm 1.2.1 — estatísticas anônimas" --notes-file windows-notes.md --latest
          else
            gh release create "$WINDOWS_TAG" release/windows/HunteraFarm-Setup-1.2.1-x64.exe release/windows/HunteraFarm-Sem-Instalar-1.2.1-x64.zip release/windows/SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "HunteraFarm 1.2.1 — estatísticas anônimas" --notes-file windows-notes.md --latest
          fi

      - name: Publicar Android 0.1.3 beta
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$ANDROID_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$ANDROID_TAG" release/android/HunteraFarm-Android-0.1.3-beta.apk release/android/SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$ANDROID_TAG" --repo "$GITHUB_REPOSITORY" --title "HunteraFarm 0.1.3 beta para Android" --notes-file android-notes.md --prerelease
          else
            gh release create "$ANDROID_TAG" release/android/HunteraFarm-Android-0.1.3-beta.apk release/android/SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "HunteraFarm 0.1.3 beta para Android" --notes-file android-notes.md --prerelease
          fi
