name: Android Beta

on:
  push:
    branches:
      - main
    paths:
      - "android/**"
      - ".github/workflows/android-beta.yml"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android-beta.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-beta-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Validar e gerar APK beta
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: android

    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Preparar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Preparar Gradle e cache
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.5.0"

      - name: Verificar codigo Android
        run: gradle --no-daemon --stacktrace lintDebug testDebugUnitTest

      - name: Gerar APK beta
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Preparar arquivo publico e checksum
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/HunteraFarm-Android-0.1.2-beta.apk
          cd app/build/outputs/apk/debug
          sha256sum HunteraFarm-Android-0.1.2-beta.apk > SHA256SUMS.txt

      - name: Disponibilizar APK beta
        uses: actions/upload-artifact@v7
        with:
          name: HunteraFarm-Android-Beta-${{ github.run_number }}
          path: |
            android/app/build/outputs/apk/debug/HunteraFarm-Android-0.1.2-beta.apk
            android/app/build/outputs/apk/debug/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
